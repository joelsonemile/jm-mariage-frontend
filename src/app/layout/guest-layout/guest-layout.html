<app-theme-toggle></app-theme-toggle>
<div class="min-h-screen bg-[var(--color-bg)] pb-20">
  <router-outlet></router-outlet>
</div>

<nav
  class="fixed bottom-0 inset-x-0 z-40 bg-[var(--color-bg-secondary)]/95 backdrop-blur border-t border-[var(--color-border)] flex items-center justify-around max-w-lg mx-auto"
>
  <app-bottom-nav-item link="/guest" [exact]="true" label="Accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/guest/plan" label="Plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z" />
      <circle cx="12" cy="10" r="2.5" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/guest/infos" label="Infos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M3 9h18M8 2v4M16 2v4" />
    </svg>
  </app-bottom-nav-item>
  @if (mapUrl()) {
    <a
      [href]="mapUrl()"
      target="_blank"
      rel="noopener"
      class="flex flex-col items-center gap-1 text-[var(--color-text-muted)] py-2 px-3 rounded-xl transition-colors"
    >
      <span class="w-5 h-5">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z" />
          <path d="M9 10.5l2-1 2 1 2-1M9 10.5v3l2 1 2-1v-3" />
        </svg>
      </span>
      <span class="text-[10px] tracking-wide">Itinéraire</span>
    </a>
  }
  <app-bottom-nav-item link="/guest/profil" label="Profil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
    </svg>
  </app-bottom-nav-item>
</nav>
