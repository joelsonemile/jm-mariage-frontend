<header class="sticky top-0 z-30 bg-[var(--color-bg-secondary)]/95 backdrop-blur border-b border-[var(--color-border)] px-4 py-3 flex items-center justify-between">
  <div>
    <div class="text-[10px] tracking-widest text-[var(--color-text-muted)]">ESPACE ADMIN</div>
    <div class="font-display text-lg text-[var(--color-gold)]">JM · Gestion</div>
  </div>
  <div class="flex items-center gap-2">
    <app-theme-toggle [floating]="false"></app-theme-toggle>
    <a routerLink="/guest" class="text-xs border border-[var(--color-border)] rounded-full px-3 py-1.5 text-[var(--color-text-soft)]">
      Vue invité
    </a>
    <button (click)="logout()" class="text-xs border border-[var(--color-error)] text-[var(--color-error)] rounded-full px-3 py-1.5">
      Déconnexion
    </button>
  </div>
</header>

<div class="min-h-screen bg-[var(--color-bg)] pb-20">
  <router-outlet></router-outlet>
</div>

<nav
  class="fixed bottom-0 inset-x-0 z-40 bg-[var(--color-bg-secondary)]/95 backdrop-blur border-t border-[var(--color-border)] flex items-center justify-around overflow-x-auto max-w-2xl mx-auto"
>
  <app-bottom-nav-item link="/admin" [exact]="true" label="Tableau">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="9" rx="1" />
      <rect x="14" y="3" width="7" height="5" rx="1" />
      <rect x="14" y="12" width="7" height="9" rx="1" />
      <rect x="3" y="16" width="7" height="5" rx="1" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/reservations" label="Résa.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/guests" label="Invités">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="9" cy="8" r="3" />
      <path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4a3 3 0 010 6M22 21c0-3-2-4.5-4.5-5" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/invited-guests" label="Attendus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="3" width="16" height="18" rx="2" />
      <path d="M8 7h8M9 12l2 2 4-4M8 17h5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/committee" label="Comité">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="8" cy="8" r="3" />
      <circle cx="16" cy="8" r="3" />
      <path d="M2 20c0-3 2.5-5 6-5s6 2 6 5M14 15c3 0 6 2 6 5" stroke-linecap="round" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/tables" label="Tables">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z" />
      <circle cx="12" cy="10" r="2.5" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/infos" label="Programme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M3 9h18M8 2v4M16 2v4" />
    </svg>
  </app-bottom-nav-item>
  <app-bottom-nav-item link="/admin/messages" label="Messages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" />
    </svg>
  </app-bottom-nav-item>
</nav>
