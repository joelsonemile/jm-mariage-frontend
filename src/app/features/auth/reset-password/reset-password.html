<div class="min-h-screen bg-[var(--color-bg)] flex flex-col px-6 py-8">
  <a routerLink="/auth" class="text-sm text-[var(--color-text-muted)] flex items-center gap-1 mb-8">‹ Retour</a>

  <div class="max-w-sm w-full mx-auto bg-[var(--color-surface)] border border-[var(--color-border)] rounded-2xl p-5">
    <h1 class="font-display text-xl text-[var(--color-gold)] mb-4">Nouveau mot de passe</h1>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div>
        <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">MOT DE PASSE</label>
        <input
          type="password"
          required
          [(ngModel)]="password"
          name="password"
          class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] focus:border-[var(--color-gold)] outline-none"
        />
      </div>
      <div>
        <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">CONFIRMER</label>
        <input
          type="password"
          required
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] focus:border-[var(--color-gold)] outline-none"
        />
      </div>
      <app-button type="submit" [loading]="loading()">Réinitialiser</app-button>
    </form>
  </div>
</div>
