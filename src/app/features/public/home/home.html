<div class="min-h-screen bg-[var(--color-bg)] relative overflow-hidden flex flex-col">
  <!-- Halo doré façon bokeh, thème "voyage" -->
  <div class="pointer-events-none absolute -top-24 -left-16 w-72 h-72 rounded-full bg-[var(--color-gold)]/10 blur-3xl animate-float-slow"></div>
  <div class="pointer-events-none absolute top-1/3 -right-20 w-80 h-80 rounded-full bg-[var(--color-gold-bright)]/10 blur-3xl animate-float-slow" style="animation-delay: 1.2s"></div>

  <!-- Poussière dorée scintillante -->
  <div class="pointer-events-none absolute inset-0">
    <span class="absolute top-[14%] left-[18%] w-1.5 h-1.5 rounded-full bg-[var(--color-gold-bright)] animate-twinkle"></span>
    <span class="absolute top-[22%] right-[14%] w-1 h-1 rounded-full bg-[var(--color-gold-bright)] animate-twinkle" style="animation-delay: 0.6s"></span>
    <span class="absolute top-[48%] left-[8%] w-1 h-1 rounded-full bg-[var(--color-gold)] animate-twinkle" style="animation-delay: 1.1s"></span>
    <span class="absolute top-[62%] right-[10%] w-1.5 h-1.5 rounded-full bg-[var(--color-gold-bright)] animate-twinkle" style="animation-delay: 1.6s"></span>
    <span class="absolute top-[80%] left-[22%] w-1 h-1 rounded-full bg-[var(--color-gold)] animate-twinkle" style="animation-delay: 0.3s"></span>
  </div>

  <main class="relative z-10 flex-1 flex flex-col items-center px-6 pt-14 pb-10 max-w-md mx-auto w-full text-center">
    <div class="text-[var(--color-gold)] text-xs tracking-[0.3em] mb-3 animate-fade-in-up">✦ EMBARQUEMENT ✦</div>

    <div
      class="w-40 h-40 rounded-2xl overflow-hidden border border-[var(--color-gold)]/40 mb-6 bg-[var(--color-surface)] shadow-[0_0_40px_rgba(201,168,76,0.15)] animate-fade-in-up delay-1"
    >
      <img src="assets/images/couple-1.png" alt="Joelson &amp; Marjorie" class="w-full h-full object-cover" />
    </div>

    <h1 class="font-display text-5xl tracking-wide text-shimmer animate-fade-in-up delay-2">JM</h1>
    <p class="font-accent text-lg text-[var(--color-text-soft)] mt-1 animate-fade-in-up delay-3">Joelson &amp; Marjorie</p>

    <p class="text-sm text-[var(--color-text-muted)] mt-3 animate-fade-in-up delay-3">
      {{ info()?.location || 'Agadir, Maroc' }} · {{ dateLabel() }}
    </p>

    <div class="mt-8 w-full animate-fade-in-up delay-4">
      <div class="text-[10px] tracking-widest text-[var(--color-text-muted)] mb-3">REJOIGNEZ NOTRE AVENTURE</div>
      <app-countdown [targetDate]="info()?.date || fallbackDate"></app-countdown>
    </div>

    <blockquote class="font-accent text-[var(--color-text-soft)] text-sm mt-8 leading-relaxed animate-fade-in-up delay-5">
      « Embarquez avec nous pour un voyage inoubliable de la promesse... à l'éternité »
    </blockquote>

    <div class="mt-10 w-full flex flex-col gap-3 animate-fade-in-up delay-6">
      <a
        routerLink="/auth"
        [queryParams]="{ mode: 'register' }"
        class="inline-flex items-center justify-center gap-2 rounded-full font-semibold text-sm px-6 py-3.5 bg-gradient-to-b from-[var(--color-gold-bright)] to-[var(--color-gold)] text-black shadow-[0_0_20px_rgba(255,215,0,0.25)] transition-transform active:scale-95 hover:scale-[1.02]"
      >
        ✈ Embarquer maintenant
      </a>
      <a
        routerLink="/auth"
        [queryParams]="{ mode: 'login' }"
        class="inline-flex items-center justify-center gap-2 rounded-full font-semibold text-sm px-6 py-3.5 border border-[var(--color-gold)] text-[var(--color-gold)] transition-transform active:scale-95"
      >
        Réserver mon billet
      </a>
    </div>
  </main>
</div>
