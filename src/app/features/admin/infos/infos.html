<div class="px-5 pt-6 pb-6 max-w-2xl mx-auto">
  <h1 class="font-display text-2xl text-[var(--color-text)] mb-6">Infos mariage</h1>

  <form (ngSubmit)="save()" class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-2xl p-5 flex flex-col gap-4">
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">DATE ET HEURE</label>
      <input type="datetime-local" [(ngModel)]="form.date" name="date" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
      <p class="text-[11px] text-[var(--color-text-muted)] mt-2">
        C'est cette date qui pilote le compte à rebours affiché aux invités.
      </p>
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">LIBELLÉ DE LA DATE (généré automatiquement)</label>
      <div class="w-full bg-[var(--color-bg-secondary)]/60 border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-gold-bright)]">
        {{ dateLabelPreview }}
      </div>
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">CÉRÉMONIE</label>
      <input [(ngModel)]="form.ceremonyTime" name="ceremonyTime" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">LIEU</label>
      <input [(ngModel)]="form.location" name="location" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">LIEN GOOGLE MAPS (ITINÉRAIRE)</label>
      <input [(ngModel)]="form.mapUrl" name="mapUrl" placeholder="https://maps.app.goo.gl/..." class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">TENUE</label>
      <input [(ngModel)]="form.dressCode" name="dressCode" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">PROGRAMME (RÉSUMÉ)</label>
      <input [(ngModel)]="form.programSummary" name="programSummary" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none" />
    </div>
    <div>
      <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)] mb-1.5">MOT DES MARIÉS</label>
      <textarea [(ngModel)]="form.coupleMessage" name="coupleMessage" rows="3" class="w-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg px-3.5 py-2.5 text-sm text-[var(--color-text-soft)] outline-none"></textarea>
    </div>

    <div class="border-t border-[var(--color-border)] pt-4">
      <div class="flex items-center justify-between mb-2">
        <label class="block text-[10px] tracking-widest text-[var(--color-text-muted)]">PROGRAMME DÉTAILLÉ (visible des invités)</label>
        <button type="button" (click)="addStep()" class="text-xs text-[var(--color-gold)] whitespace-nowrap">+ Ajouter une étape</button>
      </div>

      <div class="flex flex-col gap-3">
        @for (step of form.programDetailed; track trackByIndex($index); let i = $index) {
          <div class="bg-[var(--color-bg-secondary)] border border-[var(--color-border)] rounded-lg p-3 flex flex-col gap-2">
            <div class="flex gap-2">
              <input
                [(ngModel)]="step.time"
                name="stepTime-{{ i }}"
                placeholder="Heure (ex : 20h30)"
                class="w-28 bg-[var(--color-surface)] border border-[var(--color-border)] rounded-lg px-2.5 py-2 text-sm text-[var(--color-text-soft)] outline-none"
              />
              <input
                [(ngModel)]="step.title"
                name="stepTitle-{{ i }}"
                placeholder="Titre de l'étape"
                class="flex-1 bg-[var(--color-surface)] border border-[var(--color-border)] rounded-lg px-2.5 py-2 text-sm text-[var(--color-text-soft)] outline-none"
              />
              <button type="button" (click)="removeStep(i)" class="w-9 h-9 shrink-0 rounded-lg bg-[var(--color-error)]/15 text-[var(--color-error)] flex items-center justify-center">🗑</button>
            </div>
            <input
              [(ngModel)]="step.description"
              name="stepDescription-{{ i }}"
              placeholder="Détails (optionnel)"
              class="w-full bg-[var(--color-surface)] border border-[var(--color-border)] rounded-lg px-2.5 py-2 text-sm text-[var(--color-text-soft)] outline-none"
            />
          </div>
        }
        @if (!form.programDetailed?.length) {
          <p class="text-xs text-[var(--color-text-muted)] italic">Aucune étape pour le moment.</p>
        }
      </div>
    </div>

    <app-button type="submit" [loading]="saving()">Enregistrer</app-button>
  </form>
</div>
