<button
  type="button"
  (click)="theme.toggle()"
  [class]="floating
    ? 'fixed top-4 right-4 z-50 w-10 h-10 rounded-full bg-[var(--color-surface)]/90 backdrop-blur border border-[var(--color-border)] flex items-center justify-center text-[var(--color-gold)] shadow-lg transition-transform active:scale-90'
    : 'w-8 h-8 rounded-full bg-[var(--color-bg-secondary)] border border-[var(--color-border)] flex items-center justify-center text-[var(--color-gold)] transition-transform active:scale-90 shrink-0'"
  [attr.aria-label]="theme.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
  title="Changer de thème"
>
  @if (theme.theme() === 'dark') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4.5 h-4.5" style="width: 18px; height: 18px;">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        stroke-linecap="round"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke-linejoin="round" />
    </svg>
  }
</button>
