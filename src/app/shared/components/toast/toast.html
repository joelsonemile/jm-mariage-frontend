<div class="fixed top-4 inset-x-4 z-[100] flex flex-col gap-2 pointer-events-none sm:left-auto sm:right-4 sm:w-80">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto rounded-lg bg-[var(--color-bg-secondary)] px-4 py-3 shadow-lg text-sm text-[var(--color-text-soft)] animate-[fadeIn_0.2s_ease-out]"
      [style.border-left]="'4px solid ' + (toast.kind === 'success' ? 'var(--color-success)' : toast.kind === 'error' ? 'var(--color-error)' : 'var(--color-gold)')"
    >
      <div class="flex items-start justify-between gap-3">
        <span>{{ toast.message }}</span>
        <button class="w-3.5 h-3.5 shrink-0 text-[var(--color-text-muted)]" (click)="toastService.dismiss(toast.id)"><app-icon name="close" /></button>
      </div>
    </div>
  }
</div>
